  firebase_crashlytics: ^5.2.7
  firebase_performance: ^0.11.4+6
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_hooks: ^0.21.3+1
  flutter_svg: ^2.2.0
  freezed_annotation: ^2.4.4
  gap: ^3.0.1
  get_it: ^8.0.3
  go_router: ^16.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  json_annotation: ^4.8.1
  logger: ^2.6.0
  material_design_system:
    git:
      url: https://github.com/anshra1/material_design_system.git
  mocktail: ^1.0.4
  path: ^1.8.0
  path_provider: ^2.1.4
  shared_preferences: ^2.5.3
  super_drag_and_drop: ^0.9.1
  toastification:
    git:
      url: https://github.com/anshra1/toastification.git
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.7
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.4.6
  hive_generator: ^2.0.1
  json_serializable: ^6.7.1
  msix: ^3.16.12
  test: ^1.25.15
  very_good_analysis: ^9.0.0

dependency_overrides:
  matcher: 0.12.19
  material_color_utilities: ^0.13.0
 
  test_api: 0.7.11

